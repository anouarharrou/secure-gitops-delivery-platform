apiVersion: v1
kind: Pod
metadata:
  name: policy-test-unsigned-image
  namespace: delivery-demo
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: kind-registry:5000/delivery-demo-unsigned:never-signed
      command: ["python", "-c", "print('this should never start')"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]

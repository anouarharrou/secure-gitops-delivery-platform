apiVersion: v1
kind: Pod
metadata:
  name: policy-test-root-pod
  namespace: delivery-demo
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: false
    seccompProfile:
      type: Unconfined
  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 30"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false

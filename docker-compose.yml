name: secure-gitops-delivery-platform

services:
  jenkins:
    build:
      context: .
      dockerfile: ci/Dockerfile
      args:
        JENKINS_IMAGE: ${JENKINS_IMAGE:-jenkins/jenkins:2.591-jdk21}
        TRIVY_VERSION: 0.76.2
        SYFT_VERSION: 1.57.1
        COSIGN_VERSION: 3.1.4
        BUILDKIT_VERSION: 0.35.0
    image: local/secure-delivery-jenkins:lab
    container_name: delivery-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JENKINS_HTTP_PORT:-8080}:8080"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1024m -Djenkins.install.runSetupWizard=true"
      BUILDKIT_HOST: tcp://buildkitd:1234
      TZ: Africa/Casablanca
    volumes:
      - jenkins-home:/var/jenkins_home
    depends_on:
      buildkitd:
        condition: service_started
      kind-registry:
        condition: service_started
    networks:
      - delivery-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  buildkitd:
    image: ${BUILDKIT_IMAGE:-moby/buildkit:v0.35.0-rootless}
    container_name: delivery-buildkitd
    restart: unless-stopped
    command:
      - --addr
      - tcp://0.0.0.0:1234
      - --oci-worker-no-process-sandbox
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    volumes:
      - buildkit-state:/home/user/.local/share/buildkit
    networks:
      - delivery-net

  kind-registry:
    image: ${REGISTRY_IMAGE:-registry:3}
    container_name: kind-registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REGISTRY_HTTP_PORT:-5000}:5000"
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - delivery-net

volumes:
  jenkins-home:
  buildkit-state:
  registry-data:

networks:
  delivery-net:
    name: secure-delivery-net

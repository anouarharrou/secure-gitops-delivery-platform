apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-delivery-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anouarharrou/secure-gitops-delivery-platform.git
    targetRevision: main
    path: gitops/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: delivery-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true

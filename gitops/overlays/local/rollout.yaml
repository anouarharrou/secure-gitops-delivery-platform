apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: delivery-demo
  labels:
    app: delivery-demo
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: delivery-demo
  strategy:
    canary:
      stableService: delivery-demo-stable
      canaryService: delivery-demo-canary
      maxSurge: 25%
      maxUnavailable: 0
      steps:
        - setWeight: 25
        - pause:
            duration: 45s
        - analysis:
            templates:
              - templateName: delivery-demo-error-rate
        - setWeight: 50
        - pause:
            duration: 45s
        - analysis:
            templates:
              - templateName: delivery-demo-error-rate
        - setWeight: 100
  template:
    metadata:
      labels:
        app: delivery-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: demo-app:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
